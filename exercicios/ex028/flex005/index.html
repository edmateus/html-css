<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble box center</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        body{
            background-color: lightsalmon;
        }
        main{
            background-color: lightskyblue;
            height: 500px;
            width: 500px;
            display: flex;
            align-items: center;
            flex-flow: row nowrap;
            justify-content: center;
        }
        section{
            background-color: lightgreen;
            height: 200px;
            width: 200px;
            
        }    
        </style>
</head>
<body>
    <main>
        <section>
            <h1>Tela de login</h1>
        </section>
    </main>
    
</body>
</html>
