<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner{
            background-color: lightcoral;
            display: flex;
            
            flex-flow: row-reverse wrap-reverse;

        }
        div.item{
            background-color: lightcyan;
            border: 1px solid black;
            padding: 10px;
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item">Exemplos de oiusafohiafsa A</div>
        <div class="item">Exemplos de oiusafohiafsa B</div>
        <div class="item">Exemplos de oiusafohiafsa C</div>
        <div class="item">Exemplos de oiusafohiafsa D</div>
        <div class="item">Exemplos de oiusafohiafsa F</div>
        <div class="item">Exemplos de oiusafohiafsa G</div>
    </div>
    
</body>
</html>
