<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <fieldset>
        <legend>Ficha do paciente</legend>
        <form action="www.google.com" method="post" autocomplete="on">
            <div>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome" placeholder="Nome completo" value="Edson">
            </div><br>
            <div>
                <label for="inum">Número</label>
                <input type="number" name="num" id="inum" min="0" max="10" placeholder="0 a 10" step="0.1" value="5">
            </div> <br>
            <div>
                <label for="imes">Mês</label>
                <input type="month" name="mes" id="imes" value="1999-03">
            </div> <br>
            <div>
                <label for="idata">Data da prova</label>
                <input type="date" name="data" id="idata" value="2026-05-03">
            </div> <br>
            <div>
                <label for="ihora">Hora da prova</label>
                <input type="time" name="hora" id=""ihora value="13:00">
            </div> <br>
            <div>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" autocomplete="email">
            </div> <br>
            <div>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" pattern="^\(\d{2}\)\d{4.5}-\{4.5}$"> <!--pattern para expressões-->
            </div>
            <div>
                 <fieldset>
                    <legend>Esportes</legend>
                     <input type="checkbox" name="fut" id="ifut"> 
                                     <label for="ifut">Futebol</label>
                                    <br>
                                    <input type="checkbox" name="vol" id="ivol" checked>
                                    <label for="ivol">Volei</label>
                 </fieldset>
            
            </div>
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sex" id="ifem" value="F">
            <label for="ifem">Feminino</label>
            <input type="radio" name="sex" id="imas" value="M">
            <label for="imas">Masculino</label><br>        
            </fieldset> <br>
        
            <label for="icor">Qual cor você prefere?</label>
            <input type="color" name="cor" id="icor" value="000000"><br>

            <label for="isas">Seu nível de satisfação?</label>
            <input type="range" name="sas" id="isas" min="10" max="30" value="15"> <br>

            <label for="iper">Adicione uma foto de perfil</label>
            <input type="file" name="per" id="iper">
            <input type="submit" value="Enviar">


        </form>
    </fieldset>
</body>
</html>
