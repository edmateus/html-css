
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag select</title>
</head>
<body>
    <form action="cadastro.php" method="post" autocomplete="on"> 
        <label for="iest">Estado</label>
        <select name="est" id="iest">
            <optgroup label="Região Sul">
                <option value="DF">Distrito Federal</option>
                <option value="RE">Recanto das Emas</option>
                <option value="SM" selected>Samambaia Sul</option>
            </optgroup>
        </select> <br>  

        <label for="iprof">Profissões</label>
        <input type="text" name="iprof" list="iprof">
        <datalist id="iprof">
            <option value="PAD">Padeiro</option>
            <option value="CO">Coletador</option>
        </datalist>
    </form>

</body>
</html>
